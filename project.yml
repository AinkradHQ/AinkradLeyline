name: AinkradLeyline
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # Must be <= the revision the HOST embeds. A plugin built against a newer
    # SDK than the host ships cannot resolve its symbols and dies at
    # `Bundle.load()`. This is the host's current pin.
    # c315110: generation 11 -- Basic Mode. `AinkradAppModes` (opt-in, found by
    # cast) plus `AinkradBasicShell` / `AinkradModeSwitch`, the shared surface.
    #
    # MUST NOT be released until an installed host is generation 11: a plugin
    # pinned ahead of the host that loads it links symbols that host lacks and
    # dies at `Bundle.load()` with no diagnostic ("no apps").
    # 43868c9: AinkradSurfaceSettings -- the shared Open as / Open in rows.
    revision: 43868c968b8c4111f7cfa7d05fd903fcc9277d63
targets:
  LeylineFeature:
    type: library.static
    platform: macOS
    sources: [Sources/LeylineFeature]
    dependencies:
      - package: AinkradAppKit
        embed: false
  LeylinePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/LeylinePlugin]
    postBuildScripts:
      # Generate AinkradAPIVersion from the SDK this build linked,
      # rather than trusting the hand-typed Info.plist value.
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
    dependencies:
      - target: LeylineFeature
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.leyline
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/LeylinePlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lLeylineFeature"]
  LeylineFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LeylineFeatureTests]
    dependencies:
      - target: LeylineFeature
      - package: AinkradAppKit
schemes:
  LeylinePlugin:
    build: { targets: { LeylinePlugin: all, LeylineFeatureTests: [test] } }
    test:  { config: Debug, targets: [LeylineFeatureTests] }
